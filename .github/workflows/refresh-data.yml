name: Refresh catalogue data

on:
  schedule:
    # ECB reference rates are published on working days. Keep this refresh
    # separate from the less frequent, human-reviewed catalogue domains.
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      domain:
        description: Data domain to refresh
        required: true
        type: choice
        default: all
        options:
          - all
          - exchange-rates
          - subscriptions
          - models
          - api-pricing
          - benchmarks

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Refresh selected data domains
        id: refresh
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOMAIN="exchange-rates"
          else
            DOMAIN="${{ inputs.domain || 'all' }}"
          fi
          node --experimental-strip-types scripts/refresh-data.mjs "$DOMAIN"
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Create or update data refresh pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ github.token }}
          branch: automation/data-refresh
          delete-branch: true
          add-paths: |
            public/data/exchange-rates.json
          commit-message: "chore(data): refresh verified source data"
          title: "chore(data): refresh verified catalogue data"
          body: |
            ## Summary
            ${{ steps.refresh.outputs.summary }}

            All updates in this PR passed catalogue validation, type-checking, tests and the production build. Please review the source values and dates before merging.

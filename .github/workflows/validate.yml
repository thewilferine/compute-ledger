name: Validate project

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # pnpm/setup v3, verified release commit
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          version: 12.16.1
          runtime: node@22.16.0
          require-lockfile: true

      - name: Type-check
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm run build

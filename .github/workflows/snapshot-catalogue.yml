name: Snapshot catalogue history

on:
  push:
    branches: [main]
    paths:
      - "public/data/catalogue.json"
      - "src/data/schema.ts"
      - "scripts/snapshot-catalogue.mjs"
      - "scripts/lib/catalogue-history.mjs"
      - ".github/workflows/snapshot-catalogue.yml"
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue-history
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate and snapshot catalogue
        run: node --experimental-strip-types scripts/snapshot-catalogue.mjs
      - name: Commit history when changed
        run: |
          if git diff --quiet -- public/data/history; then
            echo "No new catalogue snapshot is required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/history
          git commit -m "chore: snapshot catalogue history"
          git push

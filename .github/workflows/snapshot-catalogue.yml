name: Snapshot catalogue history

on:
  push:
    branches: [main]
    paths:
      - "public/data/catalogue.json"
      - "src/data/schema.ts"
      - "scripts/snapshot-catalogue.mjs"
      - "scripts/lib/catalogue-history.mjs"
      - ".github/workflows/snapshot-catalogue.yml"
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: catalogue-history
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate and snapshot catalogue
        run: node --experimental-strip-types scripts/snapshot-catalogue.mjs
      - name: Create or update history pull request
        id: history-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/catalogue-history
          delete-branch: true
          add-paths: |
            public/data/history/**
          commit-message: "chore: snapshot catalogue history"
          title: "chore(data): update catalogue history"
          body: |
            ## Summary
            - Add a validated, immutable catalogue snapshot.
            - Record deterministic changes from the previous snapshot.
            - Update the public history index.

            Generated by the catalogue history workflow. Please review the snapshot and change set before merging.
      - name: Trigger required validation for history pull request
        if: steps.history-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.history-pr.outputs.pull-request-branch }}
        run: gh workflow run validate.yml --ref "$PR_BRANCH"

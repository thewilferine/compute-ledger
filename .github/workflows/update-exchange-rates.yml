name: Update exchange rates

on:
  schedule:
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exchange-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch ECB reference rates
        run: node scripts/update-exchange-rates.mjs
      - name: Commit updated rates
        run: |
          if git diff --quiet -- public/data/exchange-rates.json; then
            echo "Exchange rates are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/exchange-rates.json
          git commit -m "chore: update daily ECB exchange rates"
          git push
